<svg xmlns="http://www.w3.org/2000/svg" width="600" height="240" viewBox="0 0 600 240" preserveAspectRatio="none">
  <!-- 윤곽선과 흰색 하이라이트 없는 저대비 푸른 농도장. CSS에서 겹쳐 흘리고 서서히 소멸시킨다. -->
  <defs>
    <filter id="current" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".007 .018" numOctaves="3" seed="23" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .16  0 0 0 0 .51  0 0 0 0 .95  2.4 0 0 0 -.8"/>
      <feGaussianBlur stdDeviation="7 4"/>
    </filter>
    <radialGradient id="fade">
      <stop offset=".15" stop-color="white"/>
      <stop offset="1" stop-color="black"/>
    </radialGradient>
    <mask id="edges"><rect width="600" height="240" fill="url(#fade)"/></mask>
  </defs>
  <g mask="url(#edges)"><rect width="600" height="240" filter="url(#current)"/></g>
</svg>
